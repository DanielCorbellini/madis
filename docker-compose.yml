services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-records}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./db/setup-users.sql:/docker-entrypoint-initdb.d/03-setup-users.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-records}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  hardhat-node:
    profiles:
      - local
    build:
      context: .
      dockerfile: apps/integrity-domain/Dockerfile
    container_name: hardhat_node
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - ./packages/contracts-shared/src/deployments.ts:/app/packages/contracts-shared/src/deployments.ts
      - ./apps/integrity-domain/ignition/deployments:/app/apps/integrity-domain/ignition/deployments
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  data-domain:
    build:
      context: .
      dockerfile: apps/data-domain/Dockerfile
    container_name: data_domain
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DATA_DOMAIN_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgrespassword@postgres:5432/records}
      PORT: 3000
      WHITELIST_ADDRESSES: ${WHITELIST_ADDRESSES:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  anchor-service:
    build:
      context: .
      dockerfile: apps/anchor-service/Dockerfile
    container_name: anchor_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgrespassword@postgres:5432/records}
      # For now, this variables will be setted here, but in the future,
      # The idea is using another mechanism to store the private key, such as KMS or HSM
      # For now, to make things easier, we will store this informations in a .env file
      RPC_URL: ${RPC_URL:-http://hardhat-node:8545}
      ANCHOR_CHAIN_ID: ${ANCHOR_CHAIN_ID:-31337}
      ANCHOR_CRON_SCHEDULE: ${ANCHOR_CRON_SCHEDULE:-0 */3 * * *}
      ANCHOR_PRIVATE_KEY: ${ANCHOR_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      WHITELIST_ADDRESSES: ${WHITELIST_ADDRESSES:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
      ANCHOR_CONFIRMATIONS: ${ANCHOR_CONFIRMATIONS:-1}
      ANCHOR_CONFIRMATION_TIMEOUT_MS: ${ANCHOR_CONFIRMATION_TIMEOUT_MS:-300000}
      ANCHOR_MAX_FEE_GWEI: ${ANCHOR_MAX_FEE_GWEI:-100}
      ANCHOR_TX_RETRIES: ${ANCHOR_TX_RETRIES:-4}
      ANCHOR_RETRY_ALERT_THRESHOLD: ${ANCHOR_RETRY_ALERT_THRESHOLD:-5}
      ANCHOR_MAX_BATCH_SIZE: ${ANCHOR_MAX_BATCH_SIZE:-}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-600000}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # Second anchor-service instance for a second network (D2's target scenario
  # is one Sepolia + one Amoy instance running side by side). Uses its own
  # _AMOY-suffixed env vars (see .env.example) so it doesn't collide with the
  # `anchor-service` block above. Uncomment to run both networks at once.
  # anchor-service-amoy:
  #   build:
  #     context: .
  #     dockerfile: apps/anchor-service/Dockerfile
  #   container_name: anchor_service_amoy
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     NODE_ENV: ${NODE_ENV:-production}
  #     DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgrespassword@postgres:5432/records}
  #     RPC_URL: ${RPC_URL_AMOY:-https://rpc-amoy.polygon.technology}
  #     ANCHOR_CHAIN_ID: ${ANCHOR_CHAIN_ID_AMOY:-80002}
  #     ANCHOR_CRON_SCHEDULE: ${ANCHOR_CRON_SCHEDULE:-0 */3 * * *}
  #     ANCHOR_PRIVATE_KEY: ${ANCHOR_PRIVATE_KEY_AMOY:-}
  #     CONTRACT_ADDRESS: ${CONTRACT_ADDRESS_AMOY:-}
  #     WHITELIST_ADDRESSES: ${WHITELIST_ADDRESSES:-}
  #     ANCHOR_CONFIRMATIONS: ${ANCHOR_CONFIRMATIONS_AMOY:-2}
  #     ANCHOR_CONFIRMATION_TIMEOUT_MS: ${ANCHOR_CONFIRMATION_TIMEOUT_MS:-300000}
  #     ANCHOR_MAX_FEE_GWEI: ${ANCHOR_MAX_FEE_GWEI:-100}
  #     ANCHOR_TX_RETRIES: ${ANCHOR_TX_RETRIES:-4}
  #     ANCHOR_RETRY_ALERT_THRESHOLD: ${ANCHOR_RETRY_ALERT_THRESHOLD:-5}
  #     ANCHOR_MAX_BATCH_SIZE: ${ANCHOR_MAX_BATCH_SIZE:-}
  #     SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-600000}
  #     LOG_LEVEL: ${LOG_LEVEL:-info}

  monitor-service:
    build:
      context: .
      dockerfile: apps/monitor-service/Dockerfile
    container_name: monitor_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgrespassword@postgres:5432/records}
      RPC_URL: ${RPC_URL:-http://hardhat-node:8545}
      ANCHOR_CHAIN_ID: ${ANCHOR_CHAIN_ID:-31337}
      MONITOR_CRON_SCHEDULE: ${MONITOR_CRON_SCHEDULE:-*/5 * * * *}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      MONITOR_RPC_RETRIES: ${MONITOR_RPC_RETRIES:-4}
      MONITOR_SUBMITTED_STALE_MS: ${MONITOR_SUBMITTED_STALE_MS:-86400000}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
